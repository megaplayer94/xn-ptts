
name: Build Phonon Android TTS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Configure Android NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Phonon ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C strip=symbols -C link-arg=-Wl,-z,max-page-size=16384 -C target-cpu=generic -C target-feature=+dotprod,+fp16"
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          cargo ndk -t arm64-v8a -o android/jniLibs build --release -p ptts-ffi
          test -s android/jniLibs/arm64-v8a/libptts_ffi.so

      - name: Build Android Debug APK
        shell: bash
        working-directory: android/tts-engine
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="android/tts-engine/build/outputs/apk/debug/phonon-tts-engine-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libptts_ffi.so"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phonon-TTS-Android-ARM64
          path: android/tts-engine/build/outputs/apk/debug/phonon-tts-engine-debug.apk
          if-no-files-found: error
          retention-days: 7

